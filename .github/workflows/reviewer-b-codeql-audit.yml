name: Reviewer B - Independent CodeQL Static Audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  independent-codeql:
    name: GitHub CodeQL analysis of PUBLIC Publisher
    if: ${{ github.repository == 'devfactory-reviewer-trust/devfactory-reviewer-b-publisher' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pinned public PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Enforce exact source identity
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$SOURCE_REPO" = 'devfactory-reviewer-trust/devfactory-reviewer-b-publisher'
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Initialize first-party CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          languages: javascript-typescript
          queries: security-extended
          build-mode: none
      - name: Scan without upload permissions
        id: analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          upload: never
          upload-database: 'false'
      - name: Verify locally generated SARIF and fail on findings
        shell: bash
        env:
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readdirSync,readFileSync} from 'node:fs';
          import {join} from 'node:path';
          const dir=process.env.SARIF_DIR;
          if(!dir||!dir.startsWith('/')||dir.length>512)
            throw Error('CODEQL_SARIF_PATH_MISSING');
          const files=readdirSync(dir).filter(f=>f.endsWith('.sarif'));
          if(files.length<1||files.length>8)throw Error('CODEQL_SARIF_ABSENT');
          let n=0,analyses=0;
          for(const f of files){
            const content=readFileSync(join(dir,f));
            if(content.length<2||content.length>16*1024*1024)
              throw Error('CODEQL_SARIF_SIZE_INVALID');
            const sarif=JSON.parse(content.toString('utf8'));
            if(sarif.version!=='2.1.0'||!Array.isArray(sarif.runs))
              throw Error('CODEQL_SARIF_SCHEMA_INVALID');
            for(const r of sarif.runs){
              if(!Array.isArray(r.results))throw Error('CODEQL_SARIF_RESULTS_INVALID');
              analyses++;n+=r.results.length;
              for(const item of r.results.slice(0,20)){
                const file=item.locations?.[0]?.physicalLocation?.artifactLocation?.uri||'unknown';
                const line=item.locations?.[0]?.physicalLocation?.region?.startLine||0;
                console.log(JSON.stringify({
                  rule:String(item.ruleId||'unknown').slice(0,100),
                  file:String(file).slice(0,180),line}));
              }
            }
          }
          if(!analyses)throw Error('CODEQL_NO_ANALYSES');
          console.log(JSON.stringify({publicAnalyses:analyses,findings:n,
            independentSemanticReviewVerified:false,
            approvalAuthorized:false,publishEvent:null}));
          if(n)throw Error('CODEQL_SECURITY_FINDINGS_REMAIN');
          NODE
