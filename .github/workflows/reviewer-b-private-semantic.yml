name: Reviewer B - protected PRIVATE local semantic review

# Operator-only, post-approval manual execution. NEVER on PR code.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Exact private DevFactory PR to analyze (non-draft)'
        required: true
        type: string

permissions: {}

concurrency:
  group: reviewer-b-protected-real-semantic-manual
  cancel-in-progress: false

jobs:
  protected-private-local-semantic:
    name: Real Qwen PRIVATE analysis - native COMMENT only
    if: ${{ github.repository == 'devfactory-reviewer-trust/devfactory-reviewer-b-publisher' && github.ref == 'refs/heads/main' && github.actor == 'devfactory-reviewer-service' && github.event_name == 'workflow_dispatch' }}
    environment: reviewer-b-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Get exact protected PUBLIC source (no PR checkout)
        shell: bash
        env:
          PUB_REPO: ${{ github.repository }}
          PUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$PUB_REPO" = "devfactory-reviewer-trust/devfactory-reviewer-b-publisher"
          [[ "$PUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir source
          curl --fail --silent --show-error --location --retry 2 \
            --proto '=https' --proto-redir '=https' \
            --max-time 45 --max-filesize 8388608 \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${PUB_REPO}/tarball/${PUB_SHA}" \
            --output "$RUNNER_TEMP/publisher.tar.gz"
          tar -xzf "$RUNNER_TEMP/publisher.tar.gz" -C source --strip-components=1
          test -f source/scripts/protected-real-semantic-review.mjs
      - name: Install checksum-pinned Ollama BEFORE loading PRIVATE credentials
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 \
            --proto '=https' --proto-redir '=https' --max-time 300 \
            "https://github.com/ollama/ollama/releases/download/v0.40.2/ollama-linux-amd64.tar.zst" \
            --output "$RUNNER_TEMP/ollama.tar.zst"
          echo "726bee78706c281b0eeef00746efe51a044d71c592c3f0b195820707f31fdf04  $RUNNER_TEMP/ollama.tar.zst" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ollama"
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C "$RUNNER_TEMP/ollama"
          test -x "$RUNNER_TEMP/ollama/bin/ollama"
          echo "$RUNNER_TEMP/ollama/bin" >> "$GITHUB_PATH"
      - name: Start isolated local model before PRIVATE read
        shell: bash
        env:
          OLLAMA_HOST: '127.0.0.1:11434'
          OLLAMA_NO_CLOUD: '1'
          OLLAMA_NUM_PARALLEL: '1'
          MODEL: 'qwen2.5-coder:7b'
        run: |
          set -euo pipefail
          ollama serve > "$RUNNER_TEMP/ollama-service.log" 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent --noproxy '*' \
              "http://127.0.0.1:11434/api/tags" > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --noproxy '*' \
            "http://127.0.0.1:11434/api/tags" > /dev/null
          test "$MODEL" = 'qwen2.5-coder:7b'
          ollama pull "$MODEL" > /dev/null
      - name: Immutable PRIVATE diff -> local semantic findings -> native COMMENTED
        shell: bash
        env:
          REVIEWER_B_GITHUB_APP_PRIVATE_KEY_PEM: ${{ secrets.REVIEWER_B_GITHUB_APP_PRIVATE_KEY_PEM }}
          REVIEWER_B_TARGET_PR: ${{ inputs.pr_number }}
          REVIEWER_B_EXPECTED_MODEL: 'qwen2.5-coder:7b'
          OLLAMA_HOST: '127.0.0.1:11434'
          OLLAMA_NO_CLOUD: '1'
        run: |
          set -euo pipefail
          cd source
          node scripts/protected-real-semantic-review.mjs
