name: Reviewer B - Attestation Verification Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attestation-tests:
    name: Verify fail-closed attestation logic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout action: the repo currently allows only its own actions.
      # GitHub's read-only token is confined to this download step.
      - name: Download exact GitHub commit tree
        shell: bash
        env:
          GH_READ_TOKEN: \${{ github.token }}
          GH_REPO: \${{ github.repository }}
          GH_SHA: \${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir source
          curl --fail --silent --show-error --location --retry 2 \
            --header "Authorization: Bearer \${GH_READ_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/\${GH_REPO}/tarball/\${GH_SHA}" \
            --output source.tar.gz
          unset GH_READ_TOKEN
          tar -xzf source.tar.gz -C source --strip-components=1
      - name: Verify Node and run tests without token
        shell: bash
        run: |
          set -euo pipefail
          cd source
          node --version
          node --test test/*.test.mjs
